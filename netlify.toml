# ==============================================================================
# Chalksy — Netlify-only deployment
# FastAPI runs as a Netlify Serverless Function via mangum
# Qdrant Cloud handles all vector memory
# ==============================================================================

[build]
  command = "pip install -r requirements.txt -t netlify/functions/lib"
  publish = "app/templates"

[functions]
  directory = "netlify/functions"
  included_files = ["app/**", "data/demo_students.csv"]

# Route ALL API calls into the serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/omi/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

# Serve the dashboard for everything else
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[build.environment]
  PYTHON_VERSION = "3.11"
