# ==============================================================================
# Chalksy — Render.com Deployment (Free Tier Python Web Service)
# One-click deploy: https://render.com/deploy
# ==============================================================================
services:
  - type: web
    name: chalksy
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/memory/stats
    envVars:
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: QDRANT_STORAGE_PATH
        value: ./data/qdrant_storage
      - key: TASK_STATE_DB
        value: ./data/tasks.db
      - key: STUDENT_MAPPING_DB
        value: ./data/student_registry.db
      - key: LOCAL_ENCRYPTION_KEY
        generateValue: true
      - key: OMI_WEBHOOK_SECRET
        generateValue: true
      # Add your own secrets in Render Dashboard → Environment:
      # QDRANT_URL, QDRANT_API_KEY, LYZR_API_KEY, OPENROUTER_API_KEY, GEMINI_API_KEY
