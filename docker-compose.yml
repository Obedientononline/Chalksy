version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: crew-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334

  crew-app:
    build: .
    container_name: crew-autonomous-engine
    ports:
      - "8000:8000"
    environment:
      - QDRANT_URL=http://qdrant:6333
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      - qdrant
    volumes:
      - ./data:/app/data
      - ./exports:/app/exports

volumes:
  qdrant_storage:
